name: _run-integration

on:
  workflow_call:
    secrets:
      STREAM_API_SECRET:
        # Lives in the ci environment, not at repo level, so it is not inheritable at
        # call time; the job resolves it by declaring that environment below.
        required: false

concurrency:
  # Repository-wide, on purpose. The contended resource is the Stream app, not the branch.
  # Not cancel-in-progress: a half-run leaves users and channels behind.
  group: run-integration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration:
    name: 🧪 Integration tests
    environment: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, json
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-8.1-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.1-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Integration tests
        env:
          STREAM_API_KEY: ${{ vars.STREAM_API_KEY }}
          STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}
        run: make test-integration
