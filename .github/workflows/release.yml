name: Release

on:
  push:
    branches:
      - master
      - '*.x'
  workflow_dispatch:
    inputs:
      resync_tag:
        description: 'Existing tag to re-announce to Packagist, e.g. v12.1.1. Leave empty for a normal release run.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Reversible half: keep the Release PR current. Stands down only while a release is
  # already pending, because until that one is tagged there is no release commit to stop
  # the walk at and it would propose the same commits again in a second Release PR.
  release-pr:
    name: Release PR
    needs: detect
    if: needs.detect.outputs.pending != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}
          skip-github-release: true

  # The tag and the GitHub Release are irreversible, so the suite has to run before them,
  # which means knowing a release is pending before the suite starts. The tag lands on the
  # merged Release PR's merge commit while the suite runs on this workflow's own commit,
  # so `ready` also requires those to be the same commit. They are, on the path that
  # matters: the push of that merge.
  detect:
    name: Detect pending release
    if: >-
      (github.event_name == 'push' || inputs.resync_tag == '') &&
      (github.ref_name == 'master' || endsWith(github.ref_name, '.x'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      pending: ${{ steps.find.outputs.pending }}
      ready: ${{ steps.find.outputs.ready }}
    steps:
      - name: Find a merged Release PR waiting to be tagged
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          pending=false
          ready=false

          # Query the label directly. Listing closed PRs and filtering client-side loses
          # a release that has slipped past the first page, which reads as "nothing to
          # release" and passes. Filter before picking, too: a hotfix branch can hold
          # its own pending release, and taking the newest label match would drop this
          # branch's release on every run until the other one clears.
          nums="$(gh api "repos/${GITHUB_REPOSITORY}/issues" \
            -X GET -f state=closed -f labels='autorelease: pending' -f per_page=20 \
            --jq '.[] | select(.pull_request != null) | .number')"

          num=""
          sha=""
          for n in $nums; do
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${n}" \
              --jq 'select(.merged_at != null and .base.ref == env.BASE) | .merge_commit_sha // empty')"
            if [ -n "$sha" ]; then
              num="$n"
              break
            fi
          done

          if [ -z "$sha" ]; then
            echo "No pending release on ${BASE}."
          elif [ "$sha" != "$HEAD_SHA" ]; then
            # Reached when an earlier release run failed after the Release PR merged.
            # Tagging $sha here would tag a tree this run never tested, and failing
            # would redden every later push, so stand down and say why.
            pending=true
            echo "::warning::Release PR #${num} is still pending at ${sha}, which is not this run's commit ${HEAD_SHA}. Re-run the workflow run for ${sha} to finish that release."
          else
            pending=true
            ready=true
            echo "Pending release #${num} will be tagged at ${sha}."
          fi

          {
            echo "pending=${pending}"
            echo "ready=${ready}"
          } >> "$GITHUB_OUTPUT"

  tests:
    name: Tests
    needs: detect
    if: needs.detect.outputs.ready == 'true'
    uses: ./.github/workflows/run_tests.yml
    secrets: inherit

  # Irreversible half.
  release:
    name: 🚀 Tag and release
    needs: [detect, tests]
    if: needs.detect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}
          skip-github-pull-request: true

  # Packagist reads the tag itself; this only tells it to look now instead of on its own
  # schedule. Idempotent, so the workflow_dispatch input re-announces an existing tag.
  packagist:
    name: 📦 Announce to Packagist
    needs: release
    if: >-
      !cancelled() &&
      (inputs.resync_tag != '' || needs.release.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Update Packagist
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
          PACKAGIST_USERNAME: ${{ vars.PACKAGIST_USERNAME }}
          TAG: ${{ inputs.resync_tag != '' && inputs.resync_tag || needs.release.outputs.tag_name }}
        run: |
          if [ -z "$PACKAGIST_TOKEN" ] || [ -z "$PACKAGIST_USERNAME" ]; then
            echo "::warning::PACKAGIST_TOKEN or PACKAGIST_USERNAME is unset, so ${TAG} was not announced. Packagist will pick the tag up on its own schedule."
            exit 0
          fi

          echo "Announcing ${TAG} to Packagist."
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $PACKAGIST_USERNAME:$PACKAGIST_TOKEN" \
            -d '{"repository":{"url":"https://github.com/GetStream/getstream-php"}}' \
            "https://packagist.org/api/update-package")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 202 ]; then
            echo "Packagist update triggered."
            echo "$body"
          else
            echo "::error::Packagist update failed (HTTP $http_code)"
            echo "$body"
            exit 1
          fi
